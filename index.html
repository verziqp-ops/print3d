<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D друк</title>
<style>
  :root { --bg:#fbf4ea; --text:#2b2118; --accent:#f07a1a; --card:#fffaf2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17130f; --text:#f3e9dc; --accent:#ff8c2e; --card:#221c16; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .card { background:var(--card); padding:32px; border-radius:24px;
          text-align:center; max-width:320px; }
  button { background:var(--accent); color:#1a0f05; border:0; padding:14px 28px;
           border-radius:999px; font-size:16px; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <h1>3D друк</h1>
    <p>Сайт працює!</p>
    <button>Скоро тут буде каталог</button>
  </div>
</body>
</html>
